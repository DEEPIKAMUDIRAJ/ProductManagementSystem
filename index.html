<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Management System</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: linear-gradient(to right, #4facfe, #00f2fe);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .container{
      background:white;
      width:80%;
      max-width:700px;
      padding:40px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    h1{
      color:#222;
      font-size:42px;
      margin-bottom:20px;
    }

    p{
      color:#555;
      font-size:18px;
      line-height:1.6;
      margin-bottom:30px;
    }

    button{
      background:#007bff;
      color:white;
      border:none;
      padding:14px 28px;
      font-size:18px;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#0056b3;
      transform:scale(1.05);
    }

    #message{
      margin-top:20px;
      font-size:20px;
      color:green;
      font-weight:bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Product Management System</h1>

    <p>
      Manage your products efficiently with our smart and easy-to-use
      Product Management System. Add, update, and organize products
      seamlessly in one place.
    </p>

    <button onclick="showMessage()">
      Get Started
    </button>

    <div id="message"></div>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").innerHTML =
        "Welcome to the Product Management System!";
    }
  </script>

</body>
</html>
